# Local production-like stack: app + Postgres.  Run: docker compose up --build  ->  http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: timeclock
      POSTGRES_USER: timeclock
      POSTGRES_PASSWORD: timeclock
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      NODE_ENV: development          # dev mode shows login codes on screen; use production on AWS
      DATABASE_URL: postgres://timeclock:timeclock@db:5432/timeclock
      DATABASE_SSL: "false"
      JWT_SECRET: local-dev-secret
      # GOOGLE_CLIENT_ID: xxxxx.apps.googleusercontent.com
    depends_on: [db]
volumes:
  pgdata:
